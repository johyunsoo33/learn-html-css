<!doctype html>
<html lang="ko-KR">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>버튼 컴포넌트</title>
		<link rel="shortcut icon" href="/src/assets/favicon/likelion.ico" type="image/x-icon" />
		<link rel="icon" href="/src/assets/favicon/likelion.svg" />
		<link rel="stylesheet" href="/src/ui/components/button/button.css" />
		<link href="https://cdn.jsdelivr.net/gh/sun-typeface/SUIT@2/fonts/static/woff2/SUIT.css" rel="stylesheet" />
		<link
			rel="stylesheet"
			as="style"
			crossorigin
			href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css"
		/>
	</head>
	<body>
		<h1>버튼 컴포넌트</h1>
		<section>
			<div class="componentContainer">
				<h2>버튼</h2>
				<!-- Default Button -->
				<button type="button" class="button">버튼</button>
				<button type="button" disabled class="button">버튼</button>
				<hr />
				<!-- Fill Button -->
				<button type="button" class="button button--fill">버튼</button>
				<button type="button" disabled class="button button--fill">버튼</button>
				<hr />
				<!-- Outline Button -->
				<button type="button" class="button button--outline">버튼</button>
				<button type="button" disabled class="button button--outline">버튼</button>
			</section>
			</div>
	</body>
</html>
