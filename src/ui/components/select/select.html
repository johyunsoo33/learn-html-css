<!doctype html>
<html lang="ko-KR">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Select UI</title>
		<link rel="shortcut icon" href="/src/assets/favicon/likelion.ico" type="image/x-icon" />
		<link rel="icon" href="/src/assets/favicon/likelion.svg" />
		<link rel="stylesheet" href="/src/ui/components/select/select.css" />
		<link href="https://cdn.jsdelivr.net/gh/sun-typeface/SUIT@2/fonts/static/woff2/SUIT.css" rel="stylesheet" />
		<link
			rel="stylesheet"
			as="style"
			crossorigin
			href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css"
		/>
	</head>
	<body>
		<h1>Select UI</h1>
		<div class="selectWrap">
			<label class="globalIcon" for="selectLang"
				><span class="sr-only">언어 선택 글로벌 아이콘</span>
				<img src="/src/assets/icon/global.svg" alt="글로벌 아이콘" />
			</label>
			<label class="selectIcon" for="selectLang"
				><span class="sr-only">언어 선택 화살표 아이콘</span>
				<img src="/src/assets/icon/triangle.svg" alt="글로벌 아이콘" />
			</label>
			<select name="selectLang" id="selectLang" class="selectBox">
				<option value="한국어">한국어</option>
				<option value="en-US">English</option>
			</select>
		</div>
	</body>
</html>
