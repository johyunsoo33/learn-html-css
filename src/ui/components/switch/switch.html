<!doctype html>
<html lang="ko-KR">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>스위치</title>
		<link rel="shortcut icon" href="/src/assets/favicon/likelion.ico" type="image/x-icon" />
		<link rel="icon" href="/src/assets/favicon/likelion.svg" />
		<link rel="stylesheet" href="/src/ui/components/switch/switch.css" />
		<link href="https://cdn.jsdelivr.net/gh/sun-typeface/SUIT@2/fonts/static/woff2/SUIT.css" rel="stylesheet" />
		<link
			rel="stylesheet"
			as="style"
			crossorigin
			href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css"
		/>
	</head>
	<body>
		<h1>스위치</h1>
		<section>
		<div class="componentContainer">
				<h2>텍스트 스위치</h2>
				<div class="switch textSwitch">
					<input class="switchInput" role="switch" type="checkbox" name="switch-1" id="switch-1" />
					<label class="switchLabel" for="switch-1">
						<span class="sr-only">스위치</span>
					</label>
				</div>
			</section>
			<hr />
			<section>
				<h2>토글 스위치</h2>
				<div class="switch toggleSwitch">
					<input class="switchInput" role="switch" type="checkbox" name="switch-2" id="switch-2" />
					<label class="switchLabel" for="switch-2">
						<span class="sr-only">스위치</span>
					</label>
				</div>
		</div>
		</section>
	</body>
</html>
