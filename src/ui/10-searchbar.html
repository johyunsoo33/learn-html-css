		<!-- 검색바 -->
		<div class="searchBar">
			<!-- 로고 컴포넌트 -->
			<div class="brand">
				<a href="/" class="logo link">
					<svg
						aria-label="네이버"
						width="24"
						height="24"
						viewBox="0 0 24 24"
						fill="none"
						xmlns="http://www.w3.org/2000/svg"
					>
						<path
							fill-rule="evenodd"
							clip-rule="evenodd"
							d="M0 0H8L15.5 12V0H24V24H15.1875L8 12.5L8 24H0V0Z"
							fill="url(#paint0_linear_4260_3)"
						/>
						<defs>
							<linearGradient
								id="paint0_linear_4260_3"
								x1="4.5"
								y1="-1.93715e-07"
								x2="20.5"
								y2="24"
								gradientUnits="userSpaceOnUse"
							>
								<stop stop-color="#1BF008" />
								<stop offset="1" stop-color="#03CCA8" />
							</linearGradient>
						</defs>
					</svg>
				</a>
			</div>

			<!-- 검색폼 -->
			<form action=" \" class="formSearch">
				<fieldset>
					<legend class="sr-only">검색폼</legend>
					<div class="searchBox">
						<div class="searchInput">
							<label for="inputSearchArea" class="sr-only">검색어</label>
							<input
								type="search"
								name="inputSearchArea"
								id="inputSearchArea"
								placeholder="검색어를 입력해주세요"
								required
							/>
						</div>
						<!-- 검색버튼 컴포넌트 -->
						<button type="submit" aria-label="검색" class="btnSearch btnGradient">
							<span class="sr-only">검색</span>
						</button>
					</div>
				</fieldset>
			</form>
		</div>
