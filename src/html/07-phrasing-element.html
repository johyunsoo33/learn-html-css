<!doctype html>
<html lang="ko-KR">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>프레이징 요소</title>
		<style>
			.sr-only {
				position: absolute;
				width: 1px;
				height: 1px;
				padding: 0;
				margin: -1px;
				overflow: hidden;
				clip: rect(0, 0, 0, 0);
				white-space: nowrap;
				border-width: 0;
			}
		</style>
	</head>
	<body>
		<h1>프레이징 요소</h1>
		<!-- 텍스트 레벨 시맨틱 요소 -->
		<section>
			<h2>프레이징 요소 실습 1</h2>
			<h3><em>무엇이 중요한지 알게된 시간!</em></h3>
			<p>
				제가 들었던 해외 튜토리얼에 비해
				<strong>시맨틱한 마크업</strong>과 <br /><strong>접근성</strong>
				비중이 크게 다뤄져 좋았습니다. 많은 튜토리얼들이 <br />디자인을
				어떻게 구현하는지에만 초점이 맞춰져 있잖아요. <br />무엇이
				중요한지 알게되어 많은 도음이 되었습니다.
			</p>
			<br />
			<p>
				<!-- aria-hidden 스크린 리더에서 이부분의 특수문자를 읽을지 말지를 결정하는 속성-->
				<span aria-hidden="true">★★★★★</span>
				<b><span class="sr-only">강의 평점</span>5점</b>
				<i><span class="sr-only">수강생</span>우정민</i>
			</p>
		</section>
	</body>
</html>
