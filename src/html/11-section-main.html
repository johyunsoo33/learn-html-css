<!doctype html>
<html lang="ko-KR">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>섹션과 메인 요소</title>
	</head>
	<body>
		<!-- 문서 또는 사이트,어플리케이션의 각 세션,메인 영역을 구조화 하기위한  요소(elements)-->
		<h1>섹션과 메인 요소</h1>
		<!--  소개 및 탐색에 도움을 주는 콘텐츠 -->
		<header class="header">머릿말</header>
		<!-- nav 요소는 문서의 부분 중 현재 페이지 내, 또는 다른 페이지로의 링크를 보여주는 구획을 나타냅니다. -->
		<nav class="navigation">메뉴</nav>
		<div>
			<!-- main 요소는 문서의 핵심 주제나 앱의 핵심 기능에 직접적으로 연결됐거나 확장하는 콘텐츠-->
			<main class="content">
				<!-- <section> 요소는 HTML 문서의 독립적인 구획을 나타내며, 더 적합한 의미를 가진 요소가 없을 때 사용합니다.  -->
				<section class="card">콘텐츠섹션</section>
				<!-- 독립적인 컨텐츠 정보 -->
				<article class="products">콘텐츠섹션</article>
			</main>
			<!-- aside 요소는 문서의 주요 내용과 간접적으로만 연관된 부분을 나타냅니다.  -->
			<aside class="sidebar">부가정보</aside>
		</div>
		<!-- 푸터는 일반적으로 구획의 작성자, 저작권 정보, 관련 문서 등의 내용을 담습니다. -->
		<footer class="">바닥글</footer>
	</body>
</html>
