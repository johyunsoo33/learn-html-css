<!doctype html>
<html lang="ko-KR">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>iframe,object 요소</title>
	</head>
	<body>
		<h1>iframe,object 요소</h1>

		<section>
			<h2>iframe</h2>
			<iframe
				width="560"
				height="315"
				src="https://www.youtube.com/embed/yW1fPwqLoHo?si=2cFRVdLNgYLU3wM2"
				title="Justin Bieber - baby(live ver)"
				referrerpolicy="strict-origin-when-cross-origin"
				allowfullscreen
			></iframe>

			<br /><br />

			<iframe
				width="560"
				height="315"
				src="https://www.youtube.com/embed/fUcIe7-2zxw?si=ujFcv2jzxSE-8nWj"
				title="웹 접근성이란? - A0A11Y YouTube"
				referrerpolicy="strict-origin-when-cross-origin"
				allowfullscreen
			></iframe>
		</section>

		<section>
			<h2>object</h2>
			<figure>
				<object
					type="application/pdf"
					data="/src/assets/pdf/wai-aria.pdf"
					width="600"
					height="1200"
				></object>
				<figcaption>WAI-ARIA</figcaption>
			</figure>
		</section>
	</body>
</html>
