		<link rel="stylesheet" href="/src/css/styles/19-animation.css" />

	<body>
		<h1>CSS 애니메이션</h1>
		<div class="container">
			<div class="case case-0">
				<strong>Bounce Animation</strong>
				<div class="controls">
					<button type="button" class="button reset-animation">초기화</button>
					<button type="button" class="button toggle-animation">재생</button>
				</div>
				<div class="target-animation">멋쟁이</div>
			</div>

			</div>
			<div class="case case-02">

			</div>

				<div class="target-animation">사자처럼</div>
			</div>
			<div class="case case-05">
				<strong>Pulse animation</strong>
				<div class="controls">
					<button type="button" class="button reset-animation">초기화</button>

		<button type="button" class="sudoinit" style="position: fixed; top: 10px; right: 200px">전체 초기화</button>
		<button type="button" class="crazy" style="position: fixed; top: 10px; right: 10px">전체 시작</button>
